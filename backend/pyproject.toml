[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "migrations", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
  "E501",   # line length is handled by the formatter
  "RUF001", # ambiguous unicode characters in strings/comments
  "RUF002",
  "RUF003",
  "B008",   # function call in default argument (DRF/argparse idiom)
  "SIM108", # ternaries are not always clearer
  "RUF012", # DRF settings (search_fields, ordering, ...) live on the class
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501", "F401", "B011"]
"tests/*" = ["B011", "F401"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-warnings"
filterwarnings = ["ignore::DeprecationWarning"]
