name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint + tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apiforge
          POSTGRES_PASSWORD: apiforge
          POSTGRES_DB: apiforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Django system check
        run: python manage.py check --deploy --settings=config.settings.production
        env:
          DJANGO_SECRET_KEY: k7$Kx2vQ9!mT4pR8zW1yB6nH3jL0sD5fA2cE7gU9iO4pQ1rV6xC8
          DJANGO_ALLOWED_HOSTS: apiforge.example.com
          SECURE_SSL_REDIRECT: "true"

      - name: Generate the OpenAPI schema
        run: |
          python manage.py spectacular --file openapi.yaml --settings=config.settings.test
          test -s openapi.yaml
          # Parse it instead of grepping: quoting in shell strings is fragile.
          # (The gateway is a plain Django view authenticated by API key, not
          # a DRF view, so drf-spectacular intentionally does not document it.)
          python - <<'PY'
          import sys

          import yaml

          spec = yaml.safe_load(open("openapi.yaml", encoding="utf-8"))
          assert spec["openapi"].startswith("3."), "not OpenAPI 3"
          for path in ("/api/projects/", "/api/keys/", "/api/logs/",
                       "/api/analytics/summary/", "/api/auth/token/"):
              if path not in spec["paths"]:
                  print(f"missing path in schema: {path}")
                  sys.exit(1)
          print(f"schema OK: {len(spec['paths'])} paths")
          PY

      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test

      - name: Run tests (SQLite)
        run: pytest
        env:
          PIP_INDEX_URL: ""

      - name: Run tests (PostgreSQL)
        run: pytest
        env:
          PIP_INDEX_URL: ""
          TEST_DB_ENGINE: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: apiforge_test
          POSTGRES_USER: apiforge
          POSTGRES_PASSWORD: apiforge

  frontend:
    name: Frontend · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Docker · image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build the single-container image (Node SPA + Django ASGI)
        run: docker build -t apiforge:${{ github.sha }} .
      - name: Smoke-test the image
        run: |
          # config.settings.production refuses to boot without a secret key.
          docker run -d --name apiforge \
            -e DJANGO_SECRET_KEY="ci-smoke-test-key-not-a-real-secret-0123456789" \
            -e DJANGO_ALLOWED_HOSTS='*' \
            -e SERVE_SPA=true \
            -p 8000:8000 apiforge:${{ github.sha }}
          # Always clean up, even if an assertion below fails.
          trap 'docker logs apiforge || true; docker rm -f apiforge || true' EXIT

          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/api/health/ >/dev/null 2>&1; then break; fi
            sleep 3
          done

          echo "--- health ---"
          curl -fsS http://127.0.0.1:8000/api/health/ | tee /dev/stderr | grep -q '"status": "ok"'

          echo "--- SPA shell ---"
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root">'

          echo "--- client-side deep link falls back to the shell ---"
          curl -fsS http://127.0.0.1:8000/projects/some-uuid | grep -q '<div id="root">'

          echo "--- unknown API path is still a JSON 404 ---"
          status=$(curl -s -o /tmp/404.json -w '%{http_code}' http://127.0.0.1:8000/api/nope)
          test "$status" = "404"
          grep -q 'not_found' /tmp/404.json

          echo "image serves the API, the gateway SPA and JSON 404s"
