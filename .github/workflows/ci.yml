name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint + tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apiforge
          POSTGRES_PASSWORD: apiforge
          POSTGRES_DB: apiforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Django system check
        run: python manage.py check --deploy --settings=config.settings.production
        env:
          DJANGO_SECRET_KEY: k7$Kx2vQ9!mT4pR8zW1yB6nH3jL0sD5fA2cE7gU9iO4pQ1rV6xC8
          DJANGO_ALLOWED_HOSTS: apiforge.example.com
          SECURE_SSL_REDIRECT: "true"

      - name: Generate the OpenAPI schema
        run: |
          python manage.py spectacular --file openapi.yaml --settings=config.settings.test
          test -s openapi.yaml
          grep -q '"/api/projects/"' openapi.yaml
          grep -q '"/api/analytics/summary/"' openapi.yaml

      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test

      - name: Run tests (SQLite)
        run: pytest
        env:
          PIP_INDEX_URL: ""

      - name: Run tests (PostgreSQL)
        run: pytest
        env:
          PIP_INDEX_URL: ""
          TEST_DB_ENGINE: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: apiforge_test
          POSTGRES_USER: apiforge
          POSTGRES_PASSWORD: apiforge

  frontend:
    name: Frontend · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Docker · image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build the single-container image (Node SPA + Django ASGI)
        run: docker build -t apiforge:${{ github.sha }} .
      - name: Smoke-test the image
        run: |
          docker run -d --name apiforge -e SERVE_SPA=true -e DJANGO_ALLOWED_HOSTS='*' \
            -p 8000:8000 apiforge:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health/ >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/health/
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root">'
          echo "image serves both the API and the SPA"
